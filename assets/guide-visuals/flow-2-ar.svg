<svg xmlns="http://www.w3.org/2000/svg" width="900" height="398" viewBox="0 0 900 398"><rect width="900" height="398" rx="24" fill="#090b0e"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#14b8a6"/></marker></defs><text x="450" y="45" text-anchor="middle" fill="#14b8a6" font-family="Tahoma,Arial" font-size="25" direction="rtl">02 / مغادرة الموقع قبل مشاهدة منتج</text><rect x="130" y="75" width="640" height="60" rx="12" fill="#14332e" stroke="#14b8a6"/><text x="450" y="111" text-anchor="middle" fill="#d7f5e8" font-family="Tahoma,Arial" font-size="14" direction="rtl">الحدث المبدئي · تحقّق من توفره في تكامل متجرك</text><path d="M450 135V161" stroke="#14b8a6" marker-end="url(#arrow)"/><rect x="130" y="170" width="640" height="65" rx="12" fill="#11151c" stroke="#2e5046"/><text x="450" y="198" text-anchor="middle" fill="#f4f7f6" font-family="Tahoma,Arial" font-size="20" direction="rtl"><tspan x="450" dy="0">بعد فاصل تجريبي، مثل 6 ساعات ·</tspan><tspan x="450" dy="22">اعرض المساعدة واربط بفئات مفيدة</tspan></text><path d="M770 202H815V323H650" fill="none" stroke="#397661" stroke-dasharray="5 6"/><rect x="250" y="288" width="400" height="65" rx="30" fill="#0f3d2e" stroke="#34d399"/><text x="450" y="327" text-anchor="middle" fill="#91edc0" font-family="Tahoma,Arial" font-size="14" direction="rtl">تحقّق من شروط الإيقاف قبل كل رسالة</text><text x="450" y="380" text-anchor="middle" fill="#8ba79c" font-family="Tahoma,Arial" font-size="11" direction="rtl">نموذج تخطيطي مقترح للاختبار · ليس لقطة شاشة من Omnisend</text></svg>