<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="24" fill="#11151c"/><text x="55" y="55" fill="#14b8a6" font-family="Arial" font-size="16">EMAILFLOW / أرقام منشورة في دراسة حالة</text><text x="55" y="105" fill="#f4f7f6" font-family="Arial" font-size="29">إيرادات منسوبة إلى البريد الإلكتروني</text><path d="M80 395H930" stroke="#34473e"/><rect x="140" y="391" width="260" height="4" rx="6" fill="#52685f"/><rect x="580" y="170" width="260" height="225" rx="8" fill="#14b8a6"/><text x="270" y="360" text-anchor="middle" fill="#becdc5" font-family="Arial" font-size="40">£0</text><text x="710" y="140" text-anchor="middle" fill="#34d399" font-family="Arial" font-size="48">£45,471</text><text x="270" y="435" text-anchor="middle" fill="#9fb5aa" font-family="Arial" font-size="18">أغسطس 2025</text><text x="710" y="435" text-anchor="middle" fill="#9fb5aa" font-family="Arial" font-size="18">أبريل 2026</text><text x="55" y="492" fill="#a4bab0" font-family="Arial" font-size="14">رسم أُعيد إنشاؤه من أرقام منشورة، وليس لقطة شاشة من المنصة.</text><text x="55" y="522" fill="#7e968a" font-family="Arial" font-size="13">الإسناد لا يثبت مبيعات إضافية، ولا يضمن نتائج لمتجر آخر.</text></svg>